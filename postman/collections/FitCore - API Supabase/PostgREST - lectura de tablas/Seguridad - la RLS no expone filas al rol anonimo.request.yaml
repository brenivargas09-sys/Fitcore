$kind: http-request
url: "{{baseUrl}}/rest/v1/usuarios?select=*"
method: GET
headers:
  apikey: "{{anonKey}}"
queryParams:
  select: "*"
scripts:
  - type: afterResponse
    code: |-
      pm.test('La consulta responde 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('El rol anonimo no ve filas de usuarios', function () {
        pm.expect(pm.response.json()).to.be.an('array');
        pm.expect(pm.response.json().length).to.equal(0);
      });
    language: text/javascript
order: 9000
