$kind: http-request
url: "{{baseUrl}}/rest/v1/clases?select=*&order=dia_semana"
method: GET
headers:
  apikey: "{{anonKey}}"
  Authorization: Bearer {{token}}
queryParams:
  select: "*"
  order: dia_semana
scripts:
  - type: afterResponse
    code: |-
      pm.test('Consulta autorizada (200)', function () { pm.response.to.have.status(200); });
      pm.test('Devuelve arreglo de clases', function () { pm.expect(pm.response.json()).to.be.an('array'); });
    language: text/javascript
order: 2000
