$kind: http-request
url: "{{baseUrl}}/rest/v1/usuarios?select=id,nombre,apellidos,rol,activo&limit=10"
method: GET
headers:
  apikey: "{{anonKey}}"
  Authorization: Bearer {{token}}
queryParams:
  select: id,nombre,apellidos,rol,activo
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Consulta autorizada (200)', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Devuelve un arreglo', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
      pm.test('Respuesta menor a 1000 ms', function () {
        pm.expect(pm.response.responseTime).to.be.below(1000);
      });
    language: text/javascript
order: 1000
