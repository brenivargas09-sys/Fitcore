$kind: http-request
url: "{{baseUrl}}/rest/v1/pagos?select=*&order=fecha.desc"
method: GET
headers:
  apikey: "{{anonKey}}"
  Authorization: Bearer {{token}}
queryParams:
  select: "*"
  order: fecha.desc
scripts:
  - type: afterResponse
    code: |-
      pm.test('Consulta autorizada (200)', function () { pm.response.to.have.status(200); });
      pm.test('Devuelve arreglo de pagos', function () { pm.expect(pm.response.json()).to.be.an('array'); });
    language: text/javascript
order: 4000
